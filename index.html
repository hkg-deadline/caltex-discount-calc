<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加德士油價折扣計數機</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 font-sans antialiased selection:bg-red-500 selection:text-white flex flex-col justify-between">

    <div class="max-w-2xl mx-auto px-4 py-8 sm:py-12 w-full">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center space-x-3">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-white">加德士油價折扣計數機</h1>
                </div>
            </div>

            <!-- Theme Toggle Button -->
            <button id="theme-toggle" aria-label="Toggle Theme" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                <!-- Sun Icon (shown in dark mode) -->
                <svg xmlns="http://www.w3.org/2000/svg" class="hidden dark:block h-5 w-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <!-- Moon Icon (shown in light mode) -->
                <svg xmlns="http://www.w3.org/2000/svg" class="block dark:hidden h-5 w-5 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </header>

        <!-- Main Card -->
        <main class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xl overflow-hidden transition-colors duration-300">
            
            <!-- TOP SECTION: Fuel Type Toggle Buttons -->
            <div class="bg-slate-100/80 dark:bg-slate-800/60 p-4 border-b border-slate-200 dark:border-slate-800">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2.5">
                    選擇燃油種類
                </label>
                <!-- Hidden select box maintained for JS compatibility -->
                <select id="petrol" class="hidden">
                    <option value="standard" selected>黃金（平油）</option>
                    <option value="premium">白金（貴油）</option>
                </select>

                <!-- High-Contrast Button Toggle UI -->
                <div class="grid grid-cols-2 gap-2 bg-slate-200 dark:bg-slate-950 p-1.5 rounded-xl border border-slate-300/80 dark:border-slate-800">
                    <button type="button" id="btn-standard" onclick="selectPetrol('standard')" class="py-2.5 px-4 rounded-lg font-bold text-sm transition-all duration-200 shadow-md bg-red-600 dark:bg-red-500 text-white shadow-red-500/25">
                        黃金（平油）
                    </button>
                    <button type="button" id="btn-premium" onclick="selectPetrol('premium')" class="py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                        白金（貴油）
                    </button>
                </div>
            </div>

            <div class="p-6 sm:p-8 space-y-6">

                <!-- Discount Card Selection -->
                <div class="space-y-2">
                    <label for="discountCards" class="block text-sm font-semibold text-slate-700 dark:text-slate-300">
                        折扣卡
                    </label>
                    <div class="relative">
                        <select id="discountCards" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-xl px-4 py-3 appearance-none focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                            <!-- Options populated dynamically -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>

                    <!-- Custom Discount Div -->
                    <div id="customDiscountDiv" class="hidden mt-3 p-4 rounded-xl bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 space-y-2">
                        <label for="customDiscount" class="block text-xs font-medium text-slate-600 dark:text-slate-400">自訂每升折扣 ($)</label>
                        <input type="number" id="customDiscount" step="0.01" min="0" value="0" placeholder="e.g., 1.50" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                </div>

                <!-- Coupon Selection -->
                <div class="space-y-2">
                    <label for="coupons" class="block text-sm font-semibold text-slate-700 dark:text-slate-300">
                        油劵
                    </label>
                    <div class="relative">
                        <select id="coupons" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-xl px-4 py-3 appearance-none focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                            <!-- Options populated dynamically -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <!-- Calculate Button -->
                <div class="pt-2">
                    <button onclick="handleCalculate()" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-600 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-red-500/25 active:scale-[0.99] transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:focus:ring-offset-slate-900">
                        計算折扣
                    </button>
                </div>

                <!-- Error Message -->
                <div id="error" class="hidden p-4 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 text-red-600 dark:text-red-400 text-sm"></div>

                <!-- Results Block -->
                <div id="results" class="hidden pt-6 mt-6 border-t border-slate-200 dark:border-slate-800 space-y-6 focus:outline-none" tabindex="-1">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white flex items-center space-x-2">
                            <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                            <span>計算結果</span>
                        </h3>
                        
                    </div>

                    <!-- Highlight Stats Grid (3 Cards) -->
                    <div id="statsGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <!-- 1st: 入油量 -->
                        <div class="relative overflow-hidden p-3.5 sm:p-4 rounded-xl bg-gradient-to-b from-amber-50/80 to-amber-100/50 dark:from-amber-950/40 dark:to-amber-900/20 border border-amber-200/80 dark:border-amber-800/40 shadow-sm transition-transform duration-200 hover:-translate-y-0.5 flex flex-col justify-between">
                            <span class="block text-x font-semibold text-amber-700 dark:text-amber-300 mb-1">入油量</span>
                            <div class="text-2xl sm:text-2xl font-black text-amber-600 dark:text-amber-400 tracking-tight"><span id="totalLiters">0</span> <span class="text-xs font-normal">升</span></div>
                        </div>

                        <!-- 2nd: 支付金額 -->
                        <div class="relative overflow-hidden p-3.5 sm:p-4 rounded-xl bg-gradient-to-b from-red-50/80 to-red-100/50 dark:from-red-950/40 dark:to-red-900/20 border border-red-200/80 dark:border-red-800/40 shadow-sm transition-transform duration-200 hover:-translate-y-0.5 flex flex-col justify-between">
                            <div class="flex items-center justify-between mb-0.5">
                                <span class="block text-x font-semibold text-red-700 dark:text-red-300 mb-1">費用</span>
                                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[12px] font-bold bg-blue-600 text-white uppercase tracking-wider">顯示於月結單上</span>
                            </div>
                            <div class="text-2xl sm:text-2xl font-black text-red-600 dark:text-red-400 tracking-tight">$<span id="amountPaid">0</span></div>
                        </div>

                        <!-- 3rd Card: Combined, with 實際油價 Highlighted -->
                        <div class="relative overflow-hidden p-3.5 sm:p-4 rounded-xl bg-gradient-to-b from-blue-50/80 to-slate-100/50 dark:from-blue-950/30 dark:to-slate-900/40 border border-blue-200/80 dark:border-blue-800/40 shadow-sm transition-transform duration-200 hover:-translate-y-0.5 flex flex-col justify-between space-y-2">
                            
                            <!-- Highlighted Section: 實際油價-->
                            <div class="p-2.5 rounded-lg bg-blue-500/10 dark:bg-blue-500/20 border border-blue-300/50 dark:border-blue-500/30">
                                <span class="block text-x font-bold text-blue-700 dark:text-blue-300">實際每升油價</span>
                                <div class="text-2xl sm:text-3xl font-black text-blue-600 dark:text-blue-400 tracking-tight">$<span id="actualPrice">0</span></div>
                            </div>

                            <!-- 折扣-->
                            <div class="px-1 pt-1 border-t border-slate-200/80 dark:border-slate-800 flex justify-between items-end">
                                <div>
                                    <span class="block text-xs font-semibold text-emerald-700 dark:text-emerald-400">折扣</span>
                                    <div class="text-lg font-black text-emerald-600 dark:text-emerald-400 tracking-tight">$<span id="actualDiscount">0</span></div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Breakdown Details List -->
                    
                </div>

            </div>
        </main>
    </div>

    <!-- Footer --> 
    <footer class="py-6 mt-8 border-t border-slate-200 dark:border-slate-800/80 text-center text-xs text-slate-500 dark:text-slate-400">
        <!-- first row -->
        <div class="max-w-2xl mx-auto px-4 flex items-center justify-center space-x-2">
            <!-- GitHub URL -->
            <a href="https://github.com/hkg-deadline/caltex-discount-calc" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 rounded-lg px-2 py-1">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
                </svg>
                <span class="font-medium">原始碼</span>
            </a>
            <span class="hidden sm:inline text-slate-300 dark:text-slate-700">•</span>

            <!-- GPL-3.0 License Badge / Link -->
            <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-1.5 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 rounded-lg px-2 py-1">
                <svg class="w-4 h-4 text-emerald-500 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                <span><strong class="font-semibold text-slate-700 dark:text-slate-300">GPL-3.0</strong> License</span>
            </a>
        </div>
        <!-- second row -->
        <div class="max-w-2xl mx-auto px-4 flex items-center justify-center space-x-2">
            <!-- Petrol Price Data Soruce-->
            <a href="https://data.gov.hk" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 rounded-lg px-2 py-1">
                <span class="font-medium">燃油價錢數據來源：開放數據平台 (https://data.gov.hk)</span>
            </a>
        </div>
    </footer>
    <!-- External JavaScript files -->
    <script src="./js/themeChange.js"></script>
    <script src="./js/tailwind.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
